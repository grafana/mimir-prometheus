name: Validate native metadata sync
on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      envelope:
        type: string
        required: true
      round:
        type: number
        required: true
permissions:
  contents: read
cache-mode: none
env:
  SYNC_BOT_NAME: ${{ vars.SYNC_BOT_NAME }}
  SYNC_BOT_EMAIL: ${{ vars.SYNC_BOT_EMAIL }}
  SYNC_SIGNING_PUBLIC_KEY: ${{ vars.SYNC_SIGNING_PUBLIC_KEY }}
jobs:
  validate:
    name: native-metadata/${{ inputs.round }}/${{ matrix.check }}
    if: ${{ !cancelled() && github.repository == 'grafana/mimir-prometheus' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [go, variants, lint, generated, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-metadata-sync
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/ui/.nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.4.2'
          run_install: false
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.artifact }}
          merge-multiple: true
          path: input
      - name: Validate candidate
        id: run
        env:
          ENVELOPE: ${{ inputs.envelope }}
          CHECK: ${{ matrix.check }}
        run: '"$RUNNER_TEMP/native-metadata-sync" validate --work "$RUNNER_TEMP/candidate" --input input --envelope "$ENVELOPE" --check "$CHECK" --diagnostics "diagnostics/$CHECK.log"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: artifact
        if: always() && hashFiles('diagnostics/*.log') != ''
        with:
          name: ${{ format('diagnostics-{0}-{1}', inputs.round, matrix.check) }}
          path: diagnostics/*.log
          if-no-files-found: error
          retention-days: 30
